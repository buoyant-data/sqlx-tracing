[package]
name = "sqlx-tracing"
version = "0.3.0"
edition = "2024"
description = "OpenTelemetry-compatible tracing for SQLx database operations in Rust."
license = "MIT"
repository = "https://github.com/jdrouet/sqlx-tracing"
documentation = "https://docs.rs/sqlx-tracing"
homepage = "https://github.com/jdrouet/sqlx-tracing"
readme = "README.md"
authors = ["Jérémie Drouet <jeremie.drouet@gmail.com>"]
keywords = ["sqlx", "tracing", "opentelemetry", "database", "observability"]
categories = ["database", "development-tools::debugging", "development-tools::profiling", "asynchronous"]

[features]
# `sqlx`'s `macros` feature is on by default, and it transitively enables
# `sqlx-core/offline`, which adds the hidden `Executor::describe` method. Enable
# `offline` by default so our `Executor` impls stay in sync (i.e. also provide
# `describe`) for the common case; opt out with `default-features = false` only
# if you also disable `sqlx`'s `macros` feature.
default = ["offline"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
mysql = ["sqlx/mysql"]
# `sqlx-core`'s `offline` feature adds the hidden `Executor::describe` method used
# by the compile-time query macros. It is enabled transitively whenever `sqlx`'s
# `macros` feature is on, so enable this alongside it to keep our `Executor` impls
# in sync (i.e. so they also provide `describe`).
offline = ["dep:sqlx-core", "sqlx-core/offline"]

[dependencies]
futures = { version = "0.3" }
sqlx = { version = "0.9", default-features = false, features = ["derive"] }
# Only pulled in by the `offline` feature, to forward `sqlx-core/offline` precisely.
sqlx-core = { version = "0.9", default-features = false, optional = true }
tracing = { version = "0.1" }

[dev-dependencies]
anyhow = "1"
opentelemetry = "0.30"
opentelemetry-testing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serial_test = { version = "3.4" }
sqlx = { version = "0.9", features = ["runtime-tokio"] }
testcontainers = "0.25"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
